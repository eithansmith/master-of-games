name: Keep Render app warm

on:
  # Covers ~11am-2pm CDT / ~10am-1pm CST (16:00-19:59 UTC), so the actual
  # 11:30am-1:30pm Central lunch window is covered year-round without
  # needing separate DST-aware schedules. Weekdays only, matching the
  # app's own weekday-only game rule.
  schedule:
    - cron: '*/10 16-19 * * 1-5'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # A Render free-tier cold start can take 20-30s+ to spin the
      # container back up - well past a short curl timeout, which just
      # makes the ping fail before the app finishes waking. Give it real
      # headroom instead of assuming it's already warm.
      - name: Ping /healthz
        run: curl -sf --max-time 60 https://master-of-games-kr9n.onrender.com/healthz
