name: Ping Render app (manual)

# NOT the keep-warm mechanism - GitHub Actions' `schedule:` trigger turned out
# to be unreliable for this (see git history: it silently dropped almost all
# runs and fired the rest hours late, outside the configured window). The
# real keep-warm ping is an external cron-job.org job hitting /healthz on a
# schedule set in that dashboard, not in this repo. This workflow is kept
# only as a manual button for an on-demand wake-up/test.
on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # A Render free-tier cold start can take 20-30s+ to spin the
      # container back up - well past a short curl timeout, which just
      # makes the ping fail before the app finishes waking. Give it real
      # headroom instead of assuming it's already warm.
      - name: Ping /healthz
        run: curl -sf --max-time 60 https://master-of-games-kr9n.onrender.com/healthz
